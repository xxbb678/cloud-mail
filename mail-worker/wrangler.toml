name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

routes = [
  { pattern = "mail.itcc.ccwu.cc", custom_domain = true }
]

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "67ab4170-e045-4b96-a513-bbe5cb3afb62"

[[kv_namespaces]]
binding = "kv"
id = "05149101aaf040faaf6aea0649ba539b"

# R2 未授权（token 无 R2 权限），附件自动降级到 KV 存储
# [[r2_buckets]]
# binding = "r2"
# bucket_name = ""

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["itcc.ccwu.cc"]
admin = "admin@itcc.ccwu.cc"
jwt_secret = "REPLACE_WITH_RANDOM_SECRET  # 部署前改成随机串,勿提交真实值"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
